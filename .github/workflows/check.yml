name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # 缓存 Playwright 浏览器。key 带 lockfile 哈希：换 playwright 版本
      # 会连 chromium 版本一起变，缓存自动失效；restore-keys 让小版本升级
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci
        
      - name: Setup environment
        run: npm run ci:setup -- --no-npm
        env:
          CI: 'true'

      - name: Check
        run: npm run check
